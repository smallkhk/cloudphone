name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
    branches:
      - 'claude/vmos-email-phone-verification-2qnaz0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One at a time, not in parallel: both platforms call electron-builder's
      # GitHub publish step, and when the release for this version doesn't
      # exist yet, each job races to create it. Whichever loses gets a 422
      # ("Published releases must have a valid tag") since the create-release
      # call isn't idempotent — serializing removes the race entirely.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
