name: Build iOS app

# Produces an UNSIGNED .ipa (signed afterwards by the owner with ESign) and
# publishes it as a GitHub Release tagged ios-v<version>.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/vmos-email-phone-verification-2qnaz0'
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-app-release.yml'

permissions:
  contents: write

concurrency:
  group: ios-app-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Vhonix.xcodeproj -scheme Vhonix -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$(cat VERSION)" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package .ipa
        run: |
          V="$(cat VERSION)"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Vhonix.app Payload/
          zip -qry "Vhonix-${V}.ipa" Payload
          ls -la "Vhonix-${V}.ipa"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(cat VERSION)"
          TAG="ios-v${V}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Vhonix iOS ${V}" --notes "Unsigned build — sign with ESign before installing." --target "$GITHUB_SHA"
          gh release upload "$TAG" "Vhonix-${V}.ipa" --clobber
